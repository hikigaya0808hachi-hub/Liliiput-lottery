<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ガトーリリピュット11周年記念抽選会</title>

<style>
body{
    font-family:sans-serif;
    text-align:center;
    padding:30px;
    background-image:url("shop.jpeg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}
.card{
    max-width:900px;
    margin:auto;
    background:rgba(255,255,255,0.94);
    padding:30px;
    border-radius:24px;
}
h1{ color:#4a5c45; }
.logo{ width:180px; }
.tart{ width:400px; max-width:90%; border-radius:18px; }

#slot-container{
    width:560px;
    max-width:95%;
    height:105px;
    margin:25px auto;
    overflow:hidden;
    border:5px solid #4a5c45;
    border-radius:18px;
    background:#fffdf8;
}
#slot{
    font-size:28px;
    font-weight:bold;
    line-height:105px;
    transition:0.08s;
}
button{
    background:#4a5c45;
    color:white;
    border:none;
    padding:16px 32px;
    font-size:22px;
    border-radius:14px;
    cursor:pointer;
    margin:6px;
}
.admin-btn{
    background:#8b6f47;
    font-size:16px;
    padding:10px 18px;
}
#remaining,#result-message{
    margin-top:18px;
    font-size:20px;
    font-weight:bold;
}
.special{
    color:#b8860b;
    font-size:32px;
}

body.special-mode{
    background:#f7d774;
}
.first{ color:#b36b00; font-size:28px; }
.second{ color:#666; font-size:26px; }
.third{ color:#8b5a2b; font-size:24px; }
.thanks{ color:#4a5c45; font-size:22px; }

#admin-panel{
    display:none;
    margin-top:25px;
    padding:18px;
    background:#f6efe4;
    border-radius:18px;
}

.confetti{
    position:fixed;
    top:-20px;
    width:12px;
    height:18px;
    background:#f5c542;
    animation:fall 3s linear forwards;
    z-index:9999;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="card">

<img src="logo.png" class="logo">

<h1>ガトーリリピュット<br>11周年記念抽選会</h1>

<p>皆さまのおかげで11周年<br>いつもありがとうございます</p>

<div id="slot-container">
    <div id="slot">🎁 抽選スタート！</div>
</div>

<div id="result-message"></div>

<button id="drawButton" onclick="startLottery()">
抽選スタート
</button>

<button
id="nextButton"
onclick="resetScreen()"
style="display:none;">
次のお客様
</button>

<button class="admin-btn" onclick="openAdmin()">店員用</button>

<div id="admin-panel">
    <h2>店員用 演出テスト</h2>
    <button class="admin-btn" onclick="closeAdmin()">
閉じる
</button>
    <p>※本数は減りません</p>

    <button class="admin-btn" onclick="testEffect('special')">特賞演出</button>
    <button class="admin-btn" onclick="testEffect('first')">1等演出</button>
    <button class="admin-btn" onclick="testEffect('second')">2等演出</button>
    <button class="admin-btn" onclick="testEffect('third')">3等演出</button>
    <button class="admin-btn" onclick="testEffect('thanks')">参加賞演出</button>

    <br><br>
    <button class="admin-btn" onclick="resetPrizePool()">本日分をリセット</button>
<br><br>


<hr>

<div id="prize-status"></div>

</div>

<script>
    function saveData(){
    localStorage.setItem("prizePool", JSON.stringify(prizePool));
}

function loadData(){
    const saved = localStorage.getItem("prizePool");

    if(saved){
        prizePool = JSON.parse(saved);
        updateRemaining();
    }
}

function startConfetti(){

    for(let i = 0; i < 80; i++){

        const confetti = document.createElement("div");
        confetti.className = "confetti";

        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.backgroundColor =
            ["#f5c542","#e85d75","#4a9f70","#6ca0dc","#ffffff"]
            [Math.floor(Math.random() * 5)];

        confetti.style.animationDuration =
            (Math.random() * 2 + 2) + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.remove();
        },4000);
    }
}
const prizes = [
    "🎁 参加賞 50円券",
    "🥉 3等 100円券",
    "🥈 2等 500円券",
    "🥇 1等 焼菓子詰め合わせ 2000円分",
    "🎊 特賞 タルト3000円分引換券"
];

let prizePool = [];

function resetPrizePool(){
    prizePool = [];
    prizePool.push(...Array(1).fill("🎊 特賞 タルト3000円分引換券"));
    prizePool.push(...Array(3).fill("🥇 1等 焼菓子詰め合わせ 2000円分"));
    prizePool.push(...Array(10).fill("🥈 2等 500円券"));
    prizePool.push(...Array(36).fill("🥉 3等 100円券"));
    prizePool.push(...Array(50).fill("🎁 参加賞 50円券"));
    updateRemaining();
    saveData();
    document.getElementById("slot").innerHTML = "🎁 抽選スタート！";
    document.getElementById("result-message").innerHTML = "";
    alert("本日分を100本にリセットしました");
}

loadData();

if(prizePool.length === 0){
    resetPrizePool();
}

let spinning = false;

function drawPrize(){
    if(prizePool.length === 0){
        return "抽選終了";
    }

    const index = Math.floor(Math.random() * prizePool.length);
    const result = prizePool[index];
    prizePool.splice(index,1);
    return result;
}

function updateRemaining(){

    document.getElementById("remaining").innerHTML =
        "残り景品数：" + prizePool.length;

    const status = {
        special: prizePool.filter(p => p.includes("特賞")).length,
        first: prizePool.filter(p => p.includes("1等")).length,
        second: prizePool.filter(p => p.includes("2等")).length,
        third: prizePool.filter(p => p.includes("3等")).length,
        thanks: prizePool.filter(p => p.includes("参加賞")).length
    };

    document.getElementById("prize-status").innerHTML =
        "<h3>本日の残数</h3>" +
        "特賞：" + status.special + " / 1<br>" +
        "1等：" + status.first + " / 3<br>" +
        "2等：" + status.second + " / 10<br>" +
        "3等：" + status.third + " / 36<br>" +
        "参加賞：" + status.thanks + " / 50<br>";
}

function showResultMessage(result){
    const message = document.getElementById("result-message");

    if(result.includes("特賞")){

    message.innerHTML =
    '<span class="special">🎊 特賞おめでとうございます！</span>';

    document.body.classList.add("special-mode");

    startConfetti();

    setTimeout(() => {
        document.body.classList.remove("special-mode");
    },5000);

}
    else if(result.includes("1等")){
        message.innerHTML =
        '<span class="first">🥇 1等おめでとうございます！<br>焼菓子詰め合わせです！</span>';
    }
    else if(result.includes("2等")){
        message.innerHTML =
        '<span class="second">🥈 2等おめでとうございます！<br>500円券です！</span>';
    }
    else if(result.includes("3等")){
        message.innerHTML =
        '<span class="third">🥉 3等おめでとうございます！<br>100円券です！</span>';
    }
    else if(result.includes("参加賞")){
        message.innerHTML =
        '<span class="thanks">ご参加ありがとうございました✨<br>50円券をお渡しします</span>';
    }
}

function startLottery(){
    if(spinning) return;

    if(prizePool.length === 0){
        alert("本日の抽選は終了しました！");
        return;
    }

    spinning = true;
    document.getElementById("result-message").innerHTML = "";

    let count = 0;
    const slot = document.getElementById("slot");

    const timer = setInterval(() => {
        const randomPrize =
            prizes[Math.floor(Math.random() * prizes.length)];

        slot.style.transform = "translateY(-105px)";

        setTimeout(() => {
            slot.innerHTML = randomPrize;
            slot.style.transform = "translateY(0px)";
        },50);

        count++;

        if(count > 32){
            clearInterval(timer);

            const result = drawPrize();

            setTimeout(() => {
                slot.innerHTML = result;
                updateRemaining();
saveData();
showResultMessage(result);

document.getElementById("drawButton").style.display = "none";
document.getElementById("nextButton").style.display = "inline-block";

spinning = false;
            },150);
        }
    },100);
}

function openAdmin(){
    const pass = prompt("店員用パスワードを入力してください");

    if(pass === "1234"){
        document.getElementById("admin-panel").style.display = "block";
    }else{
        alert("パスワードが違います");
    }
}

function testEffect(type){
    let result = "";

    if(type === "special"){
        result = "🎊 特賞 タルト3000円分引換券";
    }
    else if(type === "first"){
        result = "🥇 1等 焼菓子詰め合わせ 2000円分";
    }
    else if(type === "second"){
        result = "🥈 2等 500円券";
    }
    else if(type === "third"){
        result = "🥉 3等 100円券";
    }
    else{
        result = "🎁 参加賞 50円券";
    }

    document.getElementById("slot").innerHTML = result;
    showResultMessage(result);
}

function closeAdmin(){

    document.getElementById("admin-panel").style.display = "none";

}
function resetScreen(){

    document.getElementById("slot").innerHTML =
    "🎁 抽選スタート！";

    document.getElementById("result-message").innerHTML =
    "";

    document.getElementById("drawButton").style.display =
    "inline-block";

    document.getElementById("nextButton").style.display =
    "none";

}
</script>


</body>
</html>
